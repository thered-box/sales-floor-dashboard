<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<script>
/* Winner Roofing demo: sample-data layer for the Sales Manager Report.
   Every number, person and customer here is invented. The page makes no network requests: this
   script replaces window.fetch for the report's /api/* calls and answers them from a seeded generator,
   relative to today's date (America/New_York), so every open on the same day looks the same.
   Built into the demo page by 2026-11-25-build-demo.py; it must stay CSP-safe (no eval, no new Function). */
(function () {
  "use strict";

  /* ---------------- team (fictitious; closers match the Winner Roofing TV board) ---------------- */
  var CLOSERS = ["Marcus Hale", "Tina Alvarez", "Derek Osei", "Kayla Brooks"];
  var SETTERS = ["Jordan Pike", "Alana Reyes", "Caleb Monroe"];
  var SP = {   /* setter profiles: dials/day, pickup rate, bookings per pickup, show, decision maker, confirmation */
    "Jordan Pike":  { dials: 124, pick: 0.155, book: 0.24, show: 0.70, dm: 0.82, conf: 0.88, dpd: 2.4 },
    "Alana Reyes":  { dials: 112, pick: 0.170, book: 0.27, show: 0.74, dm: 0.85, conf: 0.91, dpd: 2.1 },
    "Caleb Monroe": { dials: 98,  pick: 0.140, book: 0.21, show: 0.61, dm: 0.75, conf: 0.79, dpd: 2.7 }
  };
  var CP = {   /* closer profiles: close rate on qualified decision-maker meetings, self-booked meetings per weekday */
    "Marcus Hale":  { close: 0.36, self: 0.45, share: 0.30 },
    "Tina Alvarez": { close: 0.33, self: 0.35, share: 0.27 },
    "Derek Osei":   { close: 0.29, self: 0.30, share: 0.23 },
    "Kayla Brooks": { close: 0.27, self: 0.30, share: 0.20 }
  };
  var QUAL_K = 15;            /* a "qualified" job: estimated $15K or more */
  var BIG_K = 40;             /* the "$40K+ jobs" lead-source bucket */

  var FAMILIES = ["Henderson", "Whitaker", "Nguyen", "Patel", "Okafor", "Brennan", "Lindqvist", "Castillo", "Murphy",
    "Delgado", "Fairbanks", "Hollis", "Kowalski", "Marsh", "Pemberton", "Quinlan", "Rasmussen", "Sandoval", "Thornton",
    "Underwood", "Wexler", "Yates", "Abernathy", "Bishop", "Carver", "Dunmore", "Ellison", "Fletcher", "Garrity",
    "Hargrove", "Iverson", "Jansen", "Kimura", "Lombardi", "McAllister", "Norcross", "Ostrowski", "Prescott", "Ridley", "Sutter"];
  var PROPERTIES = ["Oakwood HOA", "Maple Ridge Apartments", "Cedar Point Plaza", "Riverbend Community Church",
    "Harbor View Condos", "Pinecrest Self Storage", "Willow Creek HOA", "Stonegate Office Park", "Brookside Senior Living",
    "Sunset Terrace Townhomes", "Lakeshore Medical Building", "Fox Run HOA", "Granite Hills Warehouse", "Elm Street Lofts",
    "Copper Canyon Retail Center", "Magnolia Gardens HOA", "Northgate Auto Plaza", "Sycamore Heights Condos"];
  var TYPES = ["Roof inspection", "Replacement estimate", "Storm damage assessment", "Insurance claim review", "Repair estimate"];
  var SCOPES = ["Full tear-off", "Architectural shingle re-roof", "TPO re-roof", "Storm repair", "Metal roof install",
    "Roof + gutters", "Flat roof coating", "Hail claim replacement"];

  /* ---------------- seeded randomness ---------------- */
  function hash(s) { var x = 2166136261 >>> 0; for (var i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 16777619) >>> 0; } return x; }
  function R(key) {
    var a = hash("winner|" + key);
    return function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function pick(list, r) { return list[Math.floor(r() * list.length)]; }

  /* ---------------- dates (ET calendar, ISO strings) ---------------- */
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function etToday() {
    try {
      var p = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit" })
        .formatToParts(new Date()).reduce(function (o, x) { o[x.type] = x.value; return o; }, {});
      return p.year + "-" + p.month + "-" + p.day;
    } catch (e) { var t = new Date(); return t.getFullYear() + "-" + pad(t.getMonth() + 1) + "-" + pad(t.getDate()); }
  }
  var TODAY = etToday();
  /* Today fills in through the working day by the hour (ET): meetings before SNAP_H have an outcome, dials and bookings
     scale with the hours worked. Every other day is fixed, and the same hour of the same day always looks the same. */
  function etHour() { try { return +new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", hour: "numeric", hourCycle: "h23" }).format(new Date()); } catch (e) { return new Date().getHours(); } }
  var SNAP_H = Math.min(19, Math.max(8, etHour()));
  var DAY_PART = Math.min(1, Math.max(0.08, (SNAP_H - 8) / 10));
  function add(iso, n) { var d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
  function dow(iso) { return new Date(iso + "T12:00:00Z").getUTCDay(); }
  function diff(a, b) { return Math.round((Date.parse(b + "T12:00:00Z") - Date.parse(a + "T12:00:00Z")) / 864e5); }
  function mondayOf(iso) { return add(iso, -((dow(iso) + 6) % 7)); }
  function monthLast(ym) { var p = ym.split("-"); return new Date(Date.UTC(+p[0], +p[1], 0)).toISOString().slice(0, 10); }
  function bounds(kind, start) {
    if (kind === "day") { var d = /^\d{4}-\d{2}-\d{2}$/.test(start || "") ? start : TODAY; return { kind: kind, start: d, from: d, to: d }; }
    if (kind === "month") { var ym = /^\d{4}-\d{2}$/.test(start || "") ? start : TODAY.slice(0, 7); return { kind: kind, start: ym, from: ym + "-01", to: monthLast(ym) }; }
    if (kind === "quarter") {
      var y = +TODAY.slice(0, 4), q = Math.floor((+TODAY.slice(5, 7) - 1) / 3) + 1, mm = /^(\d{4})-Q([1-4])$/.exec(start || "");
      if (mm) { y = +mm[1]; q = +mm[2]; }
      var m0 = (q - 1) * 3 + 1;
      return { kind: kind, start: y + "-Q" + q, from: y + "-" + pad(m0) + "-01", to: monthLast(y + "-" + pad(m0 + 2)) };
    }
    var mon = mondayOf(/^\d{4}-\d{2}-\d{2}$/.test(start || "") ? start : TODAY);
    return { kind: "week", start: mon, from: mon, to: add(mon, 6) };
  }
  /* the team has been improving: activity a year ago ran ~18% lighter than today */
  function grow(d) { var ago = Math.max(0, diff(d, TODAY)); return 1 - 0.18 * Math.min(ago, 365) / 365; }

  /* ---------------- daily dialing ---------------- */
  var DIALS = {};
  function dials(d) {
    if (DIALS[d]) return DIALS[d];
    var out = {}, wd = dow(d);
    SETTERS.forEach(function (s) {
      var r = R("dial|" + d + "|" + s), p = SP[s], o = { p: 0, c60: 0, c30: 0, qconv: 0 };
      if (wd >= 1 && wd <= 5 && d <= TODAY && r() > 0.03) {
        var f = grow(d) * (wd === 5 ? 0.86 : 1) * (0.82 + 0.36 * r());
        if (d === TODAY) f *= DAY_PART;
        o.p = Math.round(p.dials * f);
        o.c60 = Math.round(o.p * p.pick * (0.8 + 0.4 * r()));
        o.c30 = o.c60 + Math.round(o.p * (0.04 + 0.04 * r()));
        o.qconv = Math.round(o.c60 * (0.08 + 0.1 * r()));
      }
      out[s] = o;
    });
    return (DIALS[d] = out);
  }

  /* ---------------- meetings (each one decided once, by its own seed) ---------------- */
  function closerFor(r) {
    var u = r(), acc = 0;
    for (var i = 0; i < CLOSERS.length; i++) { acc += CP[CLOSERS[i]].share; if (u < acc) return CLOSERS[i]; }
    return CLOSERS[CLOSERS.length - 1];
  }
  function makeMeeting(d, setter, selfCloser, i) {
    var key = "m|" + d + "|" + (setter || selfCloser) + "|" + i, r = R(key);
    var closer = selfCloser || closerFor(r);
    var lr = r(), lag = lr < 0.12 ? 0 : lr < 0.40 ? 1 : lr < 0.65 ? 2 : lr < 0.82 ? 3 : lr < 0.93 ? 4 : 6;
    var start = add(d, lag); if (dow(start) === 0) start = add(start, 1);
    var ch = d === TODAY ? 8 + Math.floor(r() * Math.max(1, SNAP_H - 8)) : 8 + Math.floor(r() * 10);
    var sh = lag === 0 ? Math.min(18, ch + 2 + Math.floor(r() * 3)) : 9 + Math.floor(r() * 9);
    if (dow(start) === 6) sh = 9 + Math.floor(r() * 4);
    var sm = r() < 0.5 ? "00" : "30";
    var isProp = r() < 0.15, cust = isProp ? pick(PROPERTIES, r) : pick(FAMILIES, r) + " residence";
    var size = r() < 0.11 ? null : (isProp ? Math.round(30 + r() * 90) : Math.round(10 + r() * 30));
    var rebook = !selfCloser && r() < 0.2;
    var type = pick(TYPES, r);
    var sp = setter ? SP[setter] : { show: 0.82, dm: 0.88, conf: 0.92 };
    var u = r(), outcome = u < 0.06 ? "cancel" : u < 0.13 ? "resched" : (r() < (rebook ? sp.show - 0.12 : sp.show) ? "attended" : "noshow");
    var dm = r() < sp.dm;
    var confirmed = outcome === "attended" ? r() < sp.conf : outcome === "noshow" ? r() < 0.35 : r() < 0.55;
    var unqual = size != null && size < QUAL_K && r() < 0.4;
    var deal = null;
    if (outcome === "attended") {
      var q = size != null && size >= QUAL_K;
      var pc = size == null ? 0.12 : q ? (dm ? CP[closer].close : 0.10) : 0.08;
      if (r() < pc) {
        var close = r() < 0.65 ? start : add(start, 1 + Math.floor(r() * 6));   /* most roofs sign at the appointment */
        var amount = Math.round(((size || (12 + r() * 10)) * 1000 * (0.85 + 0.3 * r())) / 50) * 50;
        var dep = Math.round(amount * (r() < 0.5 ? 0.5 : 0.3) / 50) * 50;
        deal = { close: close, amount: amount, deposit: dep, balance: amount - dep, balDate: add(close, 14 + Math.floor(r() * 18)) };
      }
    }
    return { id: "wr" + hash(key).toString(36), created: d, start: start, sh: sh, sm: sm, setter: setter, closer: closer,
      cust: cust, name: type + " – " + cust, size: size, rebook: rebook, outcome: outcome, dm: dm, confirmed: confirmed,
      unqual: unqual, deal: deal };
  }
  var CREATED = {};
  function createdOn(d) {
    if (CREATED[d]) return CREATED[d];
    var out = [], wd = dow(d);
    if (d > TODAY || wd === 0) return (CREATED[d] = out);
    var dl = dials(d);
    SETTERS.forEach(function (s) {
      var r = R("book|" + d + "|" + s), n = Math.round(dl[s].c60 * SP[s].book * (0.85 + 0.3 * r()));
      for (var i = 0; i < n; i++) out.push(makeMeeting(d, s, null, i));
    });
    CLOSERS.forEach(function (c) {
      var r = R("self|" + d + "|" + c), n = (wd <= 5 && r() < CP[c].self * (d === TODAY ? 0.5 : 1)) ? 1 : 0;
      for (var i = 0; i < n; i++) out.push(makeMeeting(d, null, c, i));
    });
    return (CREATED[d] = out);
  }
  function meetings(from, to) { var out = []; for (var d = from; d <= to; d = add(d, 1)) out = out.concat(createdOn(d)); return out; }
  function isPast(m) { return m.start < TODAY || (m.start === TODAY && m.sh < SNAP_H); }
  function cls(m) {
    if (!isPast(m)) return m.confirmed ? "confirmed" : "open";
    return m.outcome === "attended" ? "attended" : m.outcome;     /* attended | noshow | cancel | resched */
  }
  function statusText(m) {
    var c = cls(m);
    return c === "attended" ? (m.unqual ? "Showed Unqualified" : "Showed") : c === "noshow" ? "No show" : c === "cancel" ? "Canceled" :
      c === "resched" ? "Rescheduled" : c === "confirmed" ? "Confirmed" : "Unconfirmed";
  }

  /* ---------------- /api/period ---------------- */
  var SETTER_KEYS = ["dials", "pickups", "c30", "qconv", "booked", "bookedNew", "bookedRebook", "bookedQual", "bookedSizeUnknown",
    "weekNew", "weekRebook", "due", "dueNew", "dueRebook", "confirmed", "attended", "attendedNew", "attendedRebook", "attendedQual", "heldDM",
    "noshow", "cancel", "resched", "unlogged", "upcoming", "sqa", "noDM", "sizeUnknown", "deals", "dealAmt", "cash"];
  var CLOSER_KEYS = ["cash", "deals", "dealAmt", "held", "heldDM", "sqa", "noDM", "sizeUnknown"];
  var SRC = ["noshow", "3m", "other"];
  function zero(keys) { var o = {}; keys.forEach(function (k) { o[k] = 0; }); return o; }
  var PERIODS = {};
  function period(kind, start) {
    var P = bounds(kind, start), ck = P.kind + ":" + P.from;
    if (P.from > TODAY) return { kind: P.kind, start: P.start, from: P.from, to: P.to, future: true };
    if (PERIODS[ck]) return JSON.parse(JSON.stringify(PERIODS[ck]));
    var inP = function (s) { return s >= P.from && s <= P.to; };
    var weekFrom = mondayOf(P.from), weekTo = add(weekFrom, 6);
    var setters = {}, closers = {}, src = {}, byDay = {};
    SETTERS.forEach(function (s) { setters[s] = zero(SETTER_KEYS); src[s] = {}; SRC.forEach(function (b) { src[s][b] = zero(["booked", "due", "attended", "qual"]); }); });
    CLOSERS.forEach(function (c) { closers[c] = zero(CLOSER_KEYS); });
    var team = { cashAll: 0, deals: 0, dealAmt: 0, appts: 0, dials: 0, pickups: 0, c30: 0 };
    var dayOf = function (d) { return byDay[d] || (byDay[d] = { cash: 0, dials: 0, pickups: 0, appts: 0 }); };
    var list = meetings(add(P.from, -75), TODAY);
    var sqaSeen = {}, noDmSeen = {}, todayList = [];
    var bucket = function (m) { return m.rebook ? "noshow" : ((m.size || 0) >= BIG_K ? "3m" : "other"); };
    var qual = function (m) { return m.size == null ? null : (m.size >= QUAL_K && !m.unqual); };

    function pay(date, amt, m) {
      if (!date || date > TODAY || !inP(date) || !amt) return;
      team.cashAll += amt; dayOf(date).cash += amt; closers[m.closer].cash += amt;
      var since = diff(m.start, date);
      if (m.setter && since >= 0 && since <= 30) setters[m.setter].cash += amt;
    }
    list.forEach(function (m) {
      /* payments and closed deals */
      if (m.deal && m.deal.close <= TODAY) {
        pay(m.deal.close, m.deal.deposit, m); pay(m.deal.balDate, m.deal.balance, m);
        if (inP(m.deal.close)) {
          var c = closers[m.closer]; c.deals++; c.dealAmt += m.deal.amount; team.deals++; team.dealAmt += m.deal.amount;
          if (m.setter && diff(m.start, m.deal.close) <= 30) { setters[m.setter].deals++; setters[m.setter].dealAmt += m.deal.amount; }
        }
      }
      /* bookings created in the period */
      if (inP(m.created)) {
        team.appts++; dayOf(m.created).appts++;
        if (m.setter) {
          var b = setters[m.setter], q = qual(m);
          b.booked++; if (m.rebook) b.bookedRebook++; else b.bookedNew++;
          if (q === true) b.bookedQual++; else if (q === null) b.bookedSizeUnknown++;
          var sb = src[m.setter][bucket(m)]; sb.booked++; if (q === true) sb.qual++;
        }
      }
      /* meetings scheduled */
      var k = cls(m);
      if (m.setter && m.start >= weekFrom && m.start <= weekTo && k !== "cancel" && k !== "resched") {
        if (m.rebook) setters[m.setter].weekRebook++; else setters[m.setter].weekNew++;
      }
      if (!inP(m.start)) return;
      var attended = k === "attended", kind2 = null;
      if (attended) {
        var qq = qual(m);
        if (qq === null) kind2 = "unknown";
        else if (qq) {
          var key = mondayOf(m.start) + "|" + m.cust;
          if (m.dm) { if (!sqaSeen[key]) { sqaSeen[key] = 1; kind2 = "sqa"; } }
          else if (!noDmSeen[key] && !sqaSeen[key]) { noDmSeen[key] = 1; kind2 = "nodm"; }
        }
      }
      var cb = closers[m.closer];
      if (attended) { cb.held++; if (m.dm) cb.heldDM++; }
      if (kind2 === "sqa") cb.sqa++; else if (kind2 === "nodm") cb.noDM++; else if (kind2 === "unknown") cb.sizeUnknown++;
      if (P.kind === "day") todayList.push(m);
      if (!m.setter) return;
      var s = setters[m.setter];
      if (kind2 === "sqa") s.sqa++; else if (kind2 === "nodm") s.noDM++; else if (kind2 === "unknown") s.sizeUnknown++;
      if (k === "cancel") { s.cancel++; return; }
      if (k === "resched") { s.resched++; return; }
      if (!isPast(m)) { s.upcoming++; return; }
      s.due++; if (m.rebook) s.dueRebook++; else s.dueNew++;
      var sb2 = src[m.setter][bucket(m)]; sb2.due++;
      if (m.confirmed) s.confirmed++;
      if (attended) {
        s.attended++; sb2.attended++; if (m.rebook) s.attendedRebook++; else s.attendedNew++;
        if (m.dm) s.heldDM++;
        if (qual(m) === true) s.attendedQual++;
      } else if (k === "noshow") s.noshow++;
      else s.unlogged++;
    });
    /* dialing, plus small repair and service payments not tied to a closer */
    for (var d = P.from; d <= P.to && d <= TODAY; d = add(d, 1)) {
      var dl = dials(d);
      SETTERS.forEach(function (s) {
        var v = dl[s]; team.dials += v.p; team.pickups += v.c60; team.c30 += v.c30;
        var dd = dayOf(d); dd.dials += v.p; dd.pickups += v.c60;
        setters[s].dials += v.p; setters[s].pickups += v.c60; setters[s].c30 += v.c30; setters[s].qconv += v.qconv;
      });
      var rr = R("service|" + d);
      if (dow(d) >= 1 && dow(d) <= 5 && rr() < 0.4) { var amt = Math.round((600 + rr() * 4200) / 50) * 50; team.cashAll += amt; dayOf(d).cash += amt; }
    }
    var setterTeam = zero(SETTER_KEYS);
    SETTERS.forEach(function (s) { SETTER_KEYS.forEach(function (k) { setterTeam[k] += setters[s][k]; }); });
    var srcTeam = {};
    SRC.forEach(function (b) { srcTeam[b] = zero(["booked", "due", "attended", "qual"]); SETTERS.forEach(function (s) { Object.keys(srcTeam[b]).forEach(function (k) { srcTeam[b][k] += src[s][b][k]; }); }); });
    var out = {
      kind: P.kind, start: P.start, from: P.from, to: P.to, current: TODAY >= P.from && TODAY <= P.to,
      setters: setters, setterTeam: setterTeam, closers: closers, team: team, src: src, srcTeam: srcTeam, qconvTracked: true,
      today: P.kind === "day" ? todayList.map(function (m) {
        return { id: m.id, start: m.start + "T" + pad(m.sh) + ":" + m.sm + ":00-05:00", name: m.name, setter: m.setter || "Self-booked",
          closer: m.closer, status: statusText(m), confirmed: m.confirmed && (isPast(m) || cls(m) === "confirmed"), size: m.size };
      }).sort(function (a, b) { return a.start < b.start ? -1 : a.start > b.start ? 1 : 0; }) : undefined,
      byDay: (P.kind === "week" || P.kind === "day") ? byDay : undefined,
      dialsPartial: false, ts: Date.now()
    };
    PERIODS[ck] = out;
    return JSON.parse(JSON.stringify(out));
  }

  /* ---------------- /api/pipeline ---------------- */
  var STAGES = [["Inspection Scheduled", 34, 0.25, 160], ["Inspection Complete", 27, 0.45, 120], ["Estimate Sent", 22, 0.85, 75],
    ["Insurance Claim Filed", 15, 0.8, 60], ["Adjuster Meeting Set", 11, 0.9, 45], ["Negotiation", 8, 0.95, 30], ["Contract Sent", 6, 1, 18]];
  function pipeline() {
    var r = R("pipe|" + TODAY), byStage = [], expected = [], total = 0, amountTotal = 0;
    STAGES.forEach(function (st, si) {
      var n = Math.max(1, Math.round(st[1] * (0.85 + 0.3 * r()))), b = { stage: st[0], count: n, amount: 0 };
      for (var i = 0; i < n; i++) {
        var prop = r() < 0.25, amt = 0;
        if (r() < st[2]) amt = Math.round((prop ? 35000 + r() * 85000 : 11000 + r() * 26000) / 50) * 50;
        var dClose = Math.round(-12 + r() * st[3]);
        b.amount += amt; amountTotal += amt; total++;
        if (amt > 0) {
          var cust = prop ? pick(PROPERTIES, r) : pick(FAMILIES, r) + " residence";
          expected.push({ name: cust + " – " + pick(SCOPES, r), owner: CLOSERS[Math.floor(r() * CLOSERS.length)], stage: st[0], amount: amt,
            close: add(TODAY, dClose), age: 5 + Math.floor(r() * 50), dClose: dClose });
        }
      }
      byStage.push(b);
    });
    byStage.sort(function (a, b) { return b.count - a.count; });
    expected.sort(function (a, b) { return a.close < b.close ? -1 : a.close > b.close ? 1 : b.amount - a.amount; });
    return { total: total, amountTotal: amountTotal, from: add(TODAY, -30), to: add(TODAY, 180), byStage: byStage, expected: expected.slice(0, 30) };
  }

  /* ---------------- /api/forecast ---------------- */
  function dayLabel(iso) { return new Date(iso + "T00:00:00Z").toLocaleDateString("en-US", { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" }); }
  function workdays(from, n) { var out = [], d = from; while (out.length < n) { if (dow(d) !== 0 && dow(d) !== 6) out.push(d); d = add(d, 1); } return out; }
  function prevWorkdays(before, n) { var out = [], d = add(before, -1); while (out.length < n) { if (dow(d) !== 0 && dow(d) !== 6) out.push(d); d = add(d, -1); } return out; }
  function forecast() {
    var days = workdays(TODAY, 10), rdays = days.slice(0, 5), r = R("fc|" + TODAY);
    var shortSetter = SETTERS[2];                       /* one setter runs low next week, so the alert shows */
    var fsetters = SETTERS.map(function (s, si) {
      var recent = prevWorkdays(TODAY, 10).map(function (d) { return dials(d)[s].p; }).filter(function (x) { return x > 0; });
      var avg = recent.length ? recent.reduce(function (a, b) { return a + b; }, 0) / recent.length : SP[s].dials;
      var need = Math.round(avg / SP[s].dpd), firstShort = -1;
      var rows = days.map(function (d, i) {
        var fade = s === shortSetter ? 1.5 - 0.11 * i : 1.65 - 0.05 * i;
        var likely = Math.max(0, Math.round(need * fade * (0.92 + 0.16 * r())));
        var low = Math.round(likely * (0.72 + 0.1 * r())), high = Math.round(likely * (1.12 + 0.1 * r()));

      });
      var assign = firstShort < 0 ? null : { shortDay: days[firstShort], shortLabel: dayLabel(days[firstShort]), count: rows[firstShort].short,
        by: firstShort > 0 ? days[firstShort - 1] : TODAY, byLabel: firstShort > 0 ? dayLabel(days[firstShort - 1]) : "today" };
      var worked = Math.round(need * DAY_PART);
      return { id: "s" + si, name: s, avgDials: Math.round(avg), dialDays: recent.length, dialsPerDeal: SP[s].dpd, need: need,

    };
  }

  /* ---------------- /api/manager (manual fields; saves live in memory for this tab) ---------------- */
  var OPPS = ["Oakwood HOA – 42-unit re-roof, adjuster walk-through Thursday", "Cedar Point Plaza – TPO bid $186K, board decides next week",
    "Henderson residence – hail claim approved, signing Friday", "Maple Ridge Apartments – phase 2 of 3, $240K total",
    "Riverbend Community Church – metal roof, finance committee Tuesday", "Stonegate Office Park – coating vs. replacement proposal out"];
  var EXPECT = ["Whitaker residence – $24,800 (Marcus)", "Fox Run HOA clubhouse – $61,500 (Tina)", "Nguyen residence – $18,900 (Derek)",
    "Pinecrest Self Storage – $72,000 (Kayla)", "Castillo residence – $21,300 (Tina)", "Brookside Senior Living – $96,400 (Marcus)"];
  var MGR = {};
  function seed(scope) {

      v["day_proposals_" + d] = wk ? Math.round((3 + r() * 5) * part) : 0;

  }

  function route(url, method, bodyText) {

<style>
 :root{
   --board:#0a0a0b; --panel:#161618; --panel2:#1f1f23; --gold:#FFC20E; --gold2:#FFDD66;
   --ink:#ffffff; --mut:#9aa0aa; --line:#2c2c31;
   --ok:#39d98a; --warn:#ffc20e; --late:#ff5a5a;
   --display:'Arial Black','Helvetica Neue',Arial,sans-serif; --num:'Helvetica Neue',Arial,sans-serif;
 }
 *{box-sizing:border-box;margin:0;padding:0}
 html,body{background:var(--board);color:var(--ink);font-family:var(--num)}
 body{min-height:100vh;padding-bottom:6vh;
   background:radial-gradient(1000px 500px at 50% -10%, rgba(255,194,14,.08), transparent 60%), var(--board)}
 .wrap{max-width:1200px;margin:0 auto;padding:20px 20px 60px}
 .top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;
   border-bottom:3px solid var(--gold);padding:6px 0 14px;margin-bottom:20px}
 .brand{display:flex;align-items:center;font-family:var(--display);font-size:26px;font-weight:900;text-transform:uppercase;letter-spacing:.5px}
 .brand .logo{height:46px;width:auto;display:block;margin:-6px 14px -6px 0}
 .brand b{color:var(--gold)} .brand .tag{color:var(--mut);font-size:15px;margin-left:10px;letter-spacing:2px}
 .weeklbl{font-family:var(--display);color:var(--gold);font-size:16px;text-transform:uppercase;letter-spacing:1px}
 .updated{color:var(--mut);font-size:12px}
 section{margin:0 0 28px}
 h2{font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.5px;margin:0 0 12px;
   display:flex;align-items:center;gap:10px}
 h2 .n{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;background:var(--gold);
   color:#000;border-radius:8px;font-size:16px;font-weight:900}
 .hint{color:var(--mut);font-size:12.5px;font-weight:400;letter-spacing:0;text-transform:none;font-family:var(--num)}
 table{width:100%;border-collapse:collapse;font-size:15px;background:var(--panel);border-radius:10px;overflow:hidden}
 th,td{border:1px solid var(--line);padding:9px 10px;text-align:center;white-space:nowrap}
 th{background:#000;color:var(--gold);font-family:var(--display);font-size:12.5px;text-transform:uppercase;letter-spacing:.4px}
 th small,td small{display:block;color:var(--mut);font-size:10.5px;font-weight:400}
 td.nm{text-align:left;font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:14px}
 td.auto{font-weight:800} .muted{color:var(--mut)}
 tr.tot td{background:var(--gold);color:#000;font-weight:900}
 tr.tot td.nm{color:#000}
 .rowlbl{text-align:left;font-weight:700;color:var(--ink)}
 .scroll{overflow-x:auto}
 
 .me{cursor:pointer;border-radius:5px;display:inline-block;min-width:2.5ch;padding:1px 4px}
 .me:hover{outline:2px solid var(--gold);outline-offset:1px}
 .me.empty{color:#6b6b73}
 .me .pen{opacity:.3;font-size:11px;margin-left:3px} .me:hover .pen{opacity:1;color:var(--gold)}
 td.medit{background:#211d0e}
 .min{font-family:var(--num);font-size:15px;font-weight:800;text-align:center;background:#000;color:var(--gold);
   border:2px solid var(--gold);border-radius:6px;padding:3px;width:8ch}
 textarea.min{width:100%;min-width:260px;height:80px;text-align:left;font-weight:400;white-space:pre-wrap}
 
 .cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
 @media(max-width:760px){.cards{grid-template-columns:1fr}}
 .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
   border-top:4px solid var(--gold);border-radius:12px;padding:16px 18px}
 .card h3{font-family:var(--display);font-size:14px;text-transform:uppercase;color:var(--mut);letter-spacing:.5px;margin:0 0 8px}
 .bignum{font-family:var(--display);font-size:34px;font-weight:900;line-height:1}
 .bignum .of{color:var(--mut);font-size:18px} .bignum .of .me{font-size:18px}
 .bar{height:12px;background:#000;border-radius:8px;overflow:hidden;margin-top:12px;border:1px solid var(--line)}
 .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
 .barpct{color:var(--mut);font-size:12px;margin-top:6px}
 .notecard textarea.min{min-height:110px}
 .notebody{white-space:pre-wrap;color:var(--ink);font-size:14px;line-height:1.5;min-height:60px;cursor:pointer;
   border-radius:8px;padding:6px}
 .notebody:hover{outline:2px solid var(--gold);outline-offset:1px} .notebody.empty{color:#6b6b73}
 #status{color:var(--mut);font-size:13px;padding:40px;text-align:center}
 .err{color:#ff6b6b}
 .foot{color:#6b6b73;font-size:12px;text-align:center;margin-top:30px}
 .savetag{position:fixed;right:16px;bottom:16px;background:var(--ok);color:#000;font-family:var(--display);
   font-size:12px;padding:6px 12px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none}
 .savetag.on{opacity:1}
 
 .controls{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:0 0 22px}
 .tabs{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
 .tabs button{background:transparent;color:var(--mut);border:0;font-family:var(--display);font-size:13px;
   text-transform:uppercase;letter-spacing:.5px;padding:9px 18px;cursor:pointer}
 .tabs button.on{background:var(--gold);color:#000}
 .mnav{display:inline-flex;align-items:center;gap:10px}
 .mnav button{background:var(--panel);color:var(--gold);border:1px solid var(--line);border-radius:8px;
   width:36px;height:34px;font-size:18px;cursor:pointer;line-height:1}
 .mnav button:hover{border-color:var(--gold)} .mnav button:disabled{opacity:.3;cursor:default}
 .mnav .mlabel{font-family:var(--display);font-size:17px;text-transform:uppercase;letter-spacing:.5px;min-width:160px;text-align:center}
 @media(max-width:520px){.tabs button{padding:9px 11px}.mnav .mlabel{min-width:0;font-size:14px}
   .wrap{padding:16px 16px 60px} .brand{flex-wrap:wrap;font-size:20px} .brand .tag{margin-left:0}
   h2{flex-wrap:wrap} .mswitch{flex-wrap:wrap;margin-left:0} .cards{grid-template-columns:1fr !important}}
 tr.tot td small,tr.tot td .sub{color:rgba(0,0,0,.65)}
 .dpick{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;height:34px;padding:0 8px;font-family:var(--num);color-scheme:dark}
 details.help{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:0 0 28px;color:var(--mut);font-size:13px;line-height:1.5}
 details.help summary{cursor:pointer;color:var(--gold);font-family:var(--display);text-transform:uppercase;font-size:13px;letter-spacing:.5px}
 details.help li{margin:4px 0} details.help b{color:var(--ink)}
 .focus{background:#15120b;border:1px solid #3d3313;border-radius:8px;padding:8px 12px;margin:0 0 12px;color:var(--ink);font-size:13.5px}
 .mnav .sofar{color:var(--mut);font-size:11px;font-weight:400;letter-spacing:0;text-transform:none;display:block}
 
 .delta{font-size:12px;font-weight:800;margin-left:6px;white-space:nowrap}
 .delta.up{color:var(--ok)} .delta.down{color:var(--late)} .delta.flat{color:var(--mut)}
 .sub{color:var(--mut);font-size:12px;font-weight:400}
 td.pos{color:var(--ok)} td.neg{color:var(--late)}
 
 .mswitch{display:inline-flex;gap:6px;margin-left:8px}
 .mswitch button{background:#000;color:var(--mut);border:1px solid var(--line);border-radius:6px;
   font-size:11px;font-family:var(--num);padding:3px 9px;cursor:pointer;text-transform:none;letter-spacing:0}
 .mswitch button.on{background:var(--gold);color:#000;border-color:var(--gold);font-weight:800}
 .spark{display:inline-block;vertical-align:middle;height:22px}
 td.stage{text-align:left;font-weight:700}
 .pill{display:inline-block;background:#000;border:1px solid var(--line);border-radius:20px;padding:2px 10px;font-size:12px;color:var(--mut)}
 td.od{color:var(--late);font-weight:800}
 td.short{background:#3a1414;color:#ff8a8a;font-weight:800} td.okd{color:var(--ok)}
 .assign{display:inline-block;margin:0 0 10px;padding:6px 12px;border-radius:8px;font-weight:800;background:#3a1414;color:#ffb3b3;border:1px solid var(--late)}
 .assign.ok{background:#0f2a1c;color:var(--ok);border-color:var(--ok)}
</style><style>
 :root{--gold:#DBB568;--gold2:#EBD6AC;--brand-red:#E21E25}
 body{border-top:7px solid var(--brand-red);background:radial-gradient(1000px 500px at 50% -10%, rgba(226,30,37,.14), transparent 60%), var(--board)}
 .brand .logo{height:64px;margin:-10px 14px -10px 0;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
 .focus{background:#15120b;border-color:#3d3420} td.medit{background:#1f1a10}
 @media(max-width:520px){.brand .logo{height:44px;margin:0 10px 0 0}.brand .tag{font-size:12px}}
</style>
</head>

<script>

var KEY=(new URLSearchParams(location.search)).get("k")||"";
function api(p){return location.origin+p+(KEY?((p.indexOf("?")>=0?"&":"?")+"k="+encodeURIComponent(KEY)):"");}


var CLOSER_LIST=["Marcus Hale","Tina Alvarez","Derek Osei","Kayla Brooks"];
var SETTER_LIST=["Jordan Pike","Alana Reyes","Caleb Monroe"];
var SETTER={"Jordan Pike":"Jordan Pike","Alana Reyes":"Alana Reyes","Caleb Monroe":"Caleb Monroe","Marcus Hale":"Marcus Hale","Tina Alvarez":"Tina Alvarez","Derek Osei":"Derek Osei","Kayla Brooks":"Kayla Brooks"};
var REP_COLOR={"Marcus Hale":"#4FC3F7","Tina Alvarez":"#C084FC","Derek Osei":"#39D98A","Kayla Brooks":"#FF8A3D","Jordan Pike":"#F472B6","Alana Reyes":"#2DD4BF","Caleb Monroe":"#E2E8F0"};
var TREND_N={day:1,week:6,month:6,quarter:4};                     


var MODE="week";                 
var SEL={};                      
var CUR={};                      
var PD={};                       
var M={values:{}};               
var MG={values:{}};              
var MS={};                       
var PIPE=null, FC=null;
var CLM="cash", STM="showRate";  
var LOADING=0;

function pad(n){return (n<10?"0":"")+n;}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function money(v){v=Math.round(+v||0);return "$"+v.toLocaleString("en-US");}
function num(v){return (+v||0).toLocaleString("en-US");}
function fmtDate(iso){var d=new Date(iso+"T00:00:00");if(isNaN(d))return iso;
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"});}
function store(){return MODE==="month"?MG:M;}
function mval(key){var v=store().values[key];return v===undefined?"":v;}
function mnum(key){var v=store().values[key];return (v===""||v==null)?0:(+v||0);}
function pct(n,d){return d?Math.round(n/d*100):null;}
function pctTxt(n,d){var p=pct(n,d);return p==null?'<span class="muted">—</span>':p+"%";}


function etToday(){try{var p=new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date()).reduce(function(o,x){o[x.type]=x.value;return o;},{});return p.year+"-"+p.month+"-"+p.day;}
  catch(e){var t=new Date();return t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(t.getDate());}}
function isoAdd(iso,n){var d=new Date(iso+"T12:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function mondayOf(iso){var dow=(new Date(iso+"T12:00:00Z").getUTCDay()+6)%7;return isoAdd(iso,-dow);}
function ymAdd(ym,delta){var p=ym.split("-");var d=new Date(Date.UTC(+p[0],+p[1]-1+delta,1));return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1);}
function qAdd(q,delta){var y=+q.slice(0,4),n=+q.slice(6)-1+delta;y+=Math.floor(n/4);n=((n%4)+4)%4;return y+"-Q"+(n+1);}
function pAdd(kind,start,delta){return kind==="day"?isoAdd(start,delta):kind==="week"?isoAdd(start,7*delta):kind==="month"?ymAdd(start,delta):qAdd(start,delta);}
function ymLabel(ym){var p=ym.split("-");return new Date(Date.UTC(+p[0],+p[1]-1,1)).toLocaleDateString(undefined,{month:"long",year:"numeric",timeZone:"UTC"});}
function ymShort(ym){var p=ym.split("-");return new Date(Date.UTC(+p[0],+p[1]-1,1)).toLocaleDateString(undefined,{month:"short",timeZone:"UTC"});}
function pLabel(kind,start){
  if(kind==="day"){var d=new Date(start+"T12:00:00Z");return d.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric",timeZone:"UTC"});}
  if(kind==="week")return "Week of "+fmtDate(start)+" – "+fmtDate(isoAdd(start,6));
  if(kind==="month")return ymLabel(start);
  return start.slice(5)+" "+start.slice(0,4);}
function pShort(kind,start){
  if(kind==="week")return fmtDate(start);
  if(kind==="month")return ymShort(start)+(start.slice(0,4)!==CUR.month.slice(0,4)?" "+start.slice(2,4):"");
  return start.slice(5)+" "+start.slice(2,4);}
(function(){var t=etToday();CUR.day=t;SEL.day=t;CUR.week=mondayOf(t);CUR.month=t.slice(0,7);CUR.quarter=t.slice(0,4)+"-Q"+(Math.floor((+t.slice(5,7)-1)/3)+1);
  SEL.week=CUR.week;SEL.month=CUR.month;SEL.quarter=CUR.quarter;})();
function trendStarts(kind){var out=[],s=SEL[kind];for(var i=TREND_N[kind]-1;i>=0;i--)out.push(pAdd(kind,s,-i));return out;}
function P(kind,start){return PD[kind+":"+start]||null;}


function meCell(key,type,disp,def){
  var v=mval(key), empty=(v===""||v==null), hasDef=(def!==undefined&&def!==null);
  var val = empty ? (hasDef?def:null) : v;
  var show = (val===null) ? "—" : (disp?disp(val):esc(val));
  return '<span class="me'+(val===null?' empty':'')+'" data-mkey="'+esc(key)+'" data-mtype="'+type+'"'+(hasDef?' data-mdef="'+esc(def)+'"':'')+'>'+show+'<span class="pen">&#9998;</span></span>';
}
function meMoney(key,def){return meCell(key,"money",function(v){return money(v);},def);}
function meNum(key,def){return meCell(key,"num",function(v){return num(v);},def);}
function noteBlock(key){var v=mval(key),empty=(v===""||v==null);
  return '<div class="notebody'+(empty?' empty':'')+'" data-mkey="'+esc(key)+'" data-mtype="text">'+(empty?'Click to add…':esc(v))+'</div>';}
function trow(label,val,auto){return '<tr><td class="rowlbl">'+label+'</td><td'+(auto?' class="auto"':'')+'>'+val+'</td></tr>';}
function nm(r){return '<td class="nm" style="color:'+(REP_COLOR[r]||"#fff")+'">'+esc(r)+'</td>';}
function dash(){return '<span class="muted">—</span>';}


function closersTable(p,opts){opts=opts||{};
  var s='<div class="scroll"><table><tr><th>Closer</th>'+(opts.goals?'<th>Revenue<br>Min</th><th>Pipeline<br>Goal</th><th>New Pipeline<br>Added</th>':'')+
    '<th>Cash<br>Collected</th><th>Deals<br>Closed</th><th>Meetings<br>Held</th><th>SQAs</th><th>Shown &ndash;<br>no DM</th><th>Close<br>Rate</th></tr>';
  var T={cash:0,deals:0,held:0,sqa:0,noDM:0,sizeUnknown:0};
  CLOSER_LIST.forEach(function(r){var b=(p.closers&&p.closers[r])||{};Object.keys(T).forEach(function(k){T[k]+=b[k]||0;});
    s+='<tr>'+nm(r)+(opts.goals?'<td>'+meMoney("goal_rev_"+r)+'</td><td>'+meNum("goal_pipe_"+r)+'</td><td>'+meMoney("pipe_added_"+r)+'</td>':'')+
      '<td class="auto">'+money(b.cash)+'</td><td class="auto">'+num(b.deals)+'</td><td class="auto">'+num(b.held)+'</td><td class="auto">'+num(b.sqa)+'</td><td>'+num(b.noDM)+'</td><td>'+pctTxt(b.deals||0,b.held||0)+'</td></tr>';});
  s+='<tr class="tot"><td class="nm">Closers</td>'+(opts.goals?'<td></td><td></td><td></td>':'')+'<td>'+money(T.cash)+'</td><td>'+num(T.deals)+'</td><td>'+num(T.held)+'</td><td>'+num(T.sqa)+'</td><td>'+num(T.noDM)+'</td><td>'+(T.held?Math.round(T.deals/T.held*100)+'%':'—')+'</td></tr>';
  s+='</table></div><div class="barpct">Cash = CRM payments credited to the closer (company total, including unassigned, is '+money(p.team&&p.team.cashAll)+'). Meetings held = meetings assigned to the closer marked Showed, Showed Unqualified, Cash collected or Live transferred. SQA = a held meeting with a $15K+ job and the decision maker on the call (Yes / One of), once per customer per week; cash collected does not count on its own. Shown – no DM = same $15K+ job, decision maker not on the call. Close rate = deals closed ÷ meetings held.'+(T.sizeUnknown?' <b>'+num(T.sizeUnknown)+' held meeting(s) have no job size logged</b>, so they can\'t count as SQAs yet.':'')+'</div>';
  return s;}

function rate(n,d){return d?Math.round(n/d*100):null;}
function rTxt(v){return v==null?dash():v+"%";}
var SM={   
  dials:function(b){return b.dials||0;}, pickups:function(b){return b.pickups||0;},
  pickRate:function(b){return rate(b.pickups||0,b.dials||0);},
  qconv:function(b){return b.qconv||0;},
  bookedNew:function(b){return b.bookedNew||0;}, bookedRebook:function(b){return b.bookedRebook||0;}, booked:function(b){return b.booked||0;},
  bookRate:function(b){return rate(b.booked||0,b.dials||0);}, newBookRate:function(b){return rate(b.bookedNew||0,b.dials||0);},
  bookPerPick:function(b){return rate(b.booked||0,b.pickups||0);}, qualRate:function(b){return rate(b.bookedQual||0,b.booked||0);},
  weekNew:function(b){return b.weekNew||0;}, weekRebook:function(b){return b.weekRebook||0;},
  due:function(b){return b.due||0;}, confirmed:function(b){return b.confirmed||0;}, confRate:function(b){return rate(b.confirmed||0,b.due||0);},
  attended:function(b){return b.attended||0;}, showRate:function(b){return rate(b.attended||0,b.due||0);},
  showAll:function(b){return rate(b.attended||0,(b.due||0)+(b.cancel||0)+(b.resched||0));},
  newShow:function(b){return rate(b.attendedNew||0,b.dueNew||0);}, rebookShow:function(b){return rate(b.attendedRebook||0,b.dueRebook||0);},
  noshow:function(b){return b.noshow||0;}, noShowRate:function(b){return rate(b.noshow||0,b.due||0);},
  cancel:function(b){return b.cancel||0;}, resched:function(b){return b.resched||0;},
  dmShow:function(b){return rate(b.heldDM||0,b.due||0);}, sqa:function(b){return b.sqa||0;}, noDM:function(b){return b.noDM||0;},
  per100:function(b){return b.dials?Math.round((b.attended||0)/b.dials*1000)/10:null;},
  deals:function(b){return b.deals||0;}, dealAmt:function(b){return b.dealAmt||0;}, cash:function(b){return b.cash||0;},

    s+='<tr>'+nm(st.name)+'<td>'+(st.target?num(st.target):dash())+'<small>'+num(st.avgDials)+' dials/day ÷ '+R.dialsPerLead+'</small></td>'+
       '<td'+(st.overdue?' class="od"':'')+'>'+num(st.overdue)+'</td>'+
       st.rows.map(function(r){return '<td'+(r.short?' class="short"':' class="auto"')+'>'+num(r.projected)+'<small>'+num(r.scheduled)+' scheduled</small></td>';}).join('')+'</tr>';};
  R.setters.forEach(rwRow);
  s+='</table></div><div class="barpct">'+esc(R.rule)+'</div></section>';
  return s;
}

function renderForecast(){
  if(!FC||!FC.setters)return '<section><h2><span class="n">0</span>Lead Supply Forecast</h2><div class="barpct">'+(FC&&FC.error?'Forecast unavailable: '+esc(FC.error):'Loading forecast…')+'</div></section>';
  var s='<section><h2><span class="n">0</span>Lead Supply Forecast <span class="hint">next '+FC.days.length+' working days · deals on each setter\'s calling boards (low / likely / high) vs deals they work a day</span></h2>';
  var one=function(st,altGroup){
    var a=st.assign;
    s+='<h2 style="font-size:15px;margin:16px 0 8px;color:'+(REP_COLOR[st.name]||"#fff")+'">'+esc(st.name)+''+' <span class="hint">'+
      (num(st.avgDials)+' dials/day ÷ '+st.dialsPerDeal+' per deal = needs ~'+num(st.need)+' deals/day')+'</span></h2>';
    s+=a?'<div class="assign">Assign '+num(a.count)+' more leads by '+esc(a.byLabel==="today"?"today":"end of "+a.byLabel)+' · short on '+esc(a.shortLabel)+'</div>'
        :'<div class="assign ok">Enough leads for the next '+FC.days.length+' working days</div>';
    s+='<div class="scroll"><table><tr><th></th>'+st.rows.map(function(r){return '<th>'+esc(r.label)+'</th>';}).join('')+'</tr>'+
      '<tr><td class="rowlbl">Low</td>'+st.rows.map(function(r){return '<td>'+num(r.low)+'</td>';}).join('')+'</tr>'+
      '<tr><td class="rowlbl">Likely</td>'+st.rows.map(function(r){return '<td>'+num(r.likely)+'</td>';}).join('')+'</tr>'+
      '<tr><td class="rowlbl">High</td>'+st.rows.map(function(r){return '<td>'+num(r.high)+'</td>';}).join('')+'</tr>'+
      '<tr><td class="rowlbl">Available <small>likely + backlog</small></td>'+st.rows.map(function(r){return '<td class="auto">'+num(r.avail)+'</td>';}).join('')+'</tr>'+
      '<tr><td class="rowlbl">Deals short <small>vs ~'+num(st.need)+'/day</small></td>'+st.rows.map(function(r){return r.short?'<td class="short">'+num(r.short)+'</td>':'<td class="okd">0</td>';}).join('')+'</tr>'+
      '</table></div>';
  };
  FC.setters.forEach(function(st){one(st,false);});
  s+='<div class="barpct" style="margin-top:10px">Team boards today: shared pool '+num(FC.pool.rows[0].low)+' due ('+num(FC.pool.overdue)+' overdue) · no-show recovery '+num(FC.noshow.rows[0].low)+' due ('+num(FC.noshow.overdue)+' overdue). '+esc(FC.rule)+' Updated '+new Date(FC.asOf).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})+'.</div>';
  s+='</section>';
  return s;
}


function deltaHTML(cur,prev,opts){ opts=opts||{}; if(prev==null)return "";
  var diff=(+cur||0)-(+prev||0), cls=diff>0?"up":(diff<0?"down":"flat");
  var arrow=diff>0?"▲":(diff<0?"▼":"–");
  var valTxt=opts.money?money(Math.abs(diff)):num(Math.abs(diff)); var pc="";
  if(opts.pct){ if((+prev)!==0){var q=Math.round(diff/Math.abs(prev)*100);pc=" ("+(q>0?"+":"")+q+"%)";} else if(diff!==0){pc=" (new)";} }
  return ' <span class="delta '+cls+'">'+arrow+' '+valTxt+pc+'</span>'; }
function renderMonth(p){
  var MONTH=SEL.month, isCur=(MONTH===CUR.month), prevYM=ymAdd(MONTH,-1), months=[]; for(var i=5;i>=0;i--)months.push(ymAdd(MONTH,-i));
  var pp=isCur?null:P("month",prevYM), t=p.team||{}, tp=pp&&pp.team;
  var sofar=isCur?' <span class="sub">(so far)</span>':'';
  var cash=t.cashAll||0, goal=mnum("mgoal_cash")||160000, pc=goal?Math.min(100,Math.round(cash/goal*100)):0;
  var s='<section><h2><span class="n">1</span>Monthly Scoreboard'+sofar+' <span class="hint">cash goal is editable · click the yellow-outlined number</span></h2>';
  s+='<div class="cards">'+
     '<div class="card"><h3>Cash Collected</h3><div class="bignum">'+money(cash)+' <span class="of">/ '+meMoney("mgoal_cash",160000)+'</span>'+(tp?deltaHTML(cash,tp.cashAll,{money:1,pct:1}):'')+'</div>'+
       '<div class="bar"><i style="width:'+pc+'%"></i></div><div class="barpct">'+pc+'% of goal'+(tp?' · vs '+ymShort(prevYM)+' '+money(tp.cashAll||0):'')+'</div></div>'+
     '<div class="card"><h3>Deals Closed</h3><div class="bignum">'+num(t.deals)+(tp?deltaHTML(t.deals,tp.deals,{pct:1}):'')+'</div><div class="barpct">deal value '+money(t.dealAmt||0)+'</div></div>'+
     '<div class="card"><h3>Appointments Booked</h3><div class="bignum">'+num(t.appts)+(tp?deltaHTML(t.appts,tp.appts,{pct:1}):'')+'</div><div class="barpct">company-wide, incl. self-booked</div></div>'+
     '<div class="card"><h3>Outbound Dials</h3><div class="bignum">'+num(t.dials)+(tp?deltaHTML(t.dials,tp.dials,{pct:1}):'')+'</div><div class="barpct">'+num(t.pickups)+' pickups · '+pctTxt(t.pickups,t.dials)+' pickup rate</div></div>'+
     '</div></section>';
  s+=peopleSections("month",p,2,false);
  s+='<section><h2><span class="n">6</span>Setter Results <span class="hint">30-day attribution, under review</span></h2>'+setterTable(p,RESULT_COLS,false)+attribNote()+'</section>';
  s+='<section><h2><span class="n">7</span>Performance by Lead Source</h2>'+sourceTable(p)+'</section>';
  s+='<section><h2><span class="n">8</span>Month over Month <span class="hint">vs '+esc(ymLabel(prevYM))+(isCur?' · this month is still in progress':'')+'</span></h2>'+momTable(p,P("month",prevYM))+'</section>';

  
  s+='<section><h2><span class="n">9</span>Conversion &amp; Close-Rate Trends <span class="hint">team funnel by month</span></h2><div class="scroll"><table>'+
     '<tr><th style="text-align:left">Month</th><th>Dials</th><th>Pickups<br><small>&ge;1 min</small></th><th>Appts</th><th>Deals</th><th>Cash</th><th>Pickup<br>Rate</th><th>Appt /<br>Pickup</th><th>Deal /<br>Appt</th></tr>';
  months.forEach(function(m){var u=(P("month",m)||{}).team||{};
    s+='<tr><td class="rowlbl">'+esc(ymShort(m))+' '+m.slice(0,4)+(m===CUR.month?' <span class="sub">(so far)</span>':'')+'</td>'+
       '<td class="auto">'+num(u.dials)+'</td><td>'+num(u.pickups)+'</td><td class="auto">'+num(u.appts)+'</td>'+
       '<td class="auto">'+num(u.deals)+'</td><td class="auto">'+money(u.cashAll)+'</td>'+
       '<td>'+pctTxt(u.pickups||0,u.dials||0)+'</td><td>'+pctTxt(u.appts||0,u.pickups||0)+'</td><td>'+pctTxt(u.deals||0,u.appts||0)+'</td></tr>'; });
  s+='</table></div><div class="barpct">Dials and pickups are from the dialer. Deals counted for closers only.</div></section>';
  s+=renderPipeline(10);
  return s;
}

function renderQuarter(p){
  var isCur=(SEL.quarter===CUR.quarter);
  var s='<section><h2><span class="n">1</span>Quarter Scoreboard'+(isCur?' <span class="sub">(so far)</span>':'')+' <span class="hint">'+esc(fmtDate(p.from))+' – '+esc(fmtDate(p.to))+'</span></h2>'+cardsRow(p)+'</section>';
  s+=peopleSections("quarter",p,2,false);
  s+='<section><h2><span class="n">6</span>Setter Results <span class="hint">30-day attribution, under review</span></h2>'+setterTable(p,RESULT_COLS,false)+attribNote()+'</section>';
  s+='<section><h2><span class="n">7</span>Performance by Lead Source</h2>'+sourceTable(p)+'</section>';
  return s;
}
function renderPipeline(n){
  var Pp=PIPE; if(!Pp)return '<section><h2><span class="n">'+n+'</span>Pipeline / Opportunities</h2><div class="barpct">Loading pipeline…</div></section>';
  var s='<section><h2><span class="n">'+n+'</span>Pipeline / Opportunities <span class="hint">open Sales deals expected to close '+esc(fmtDate(Pp.from||""))+' – '+esc(fmtDate(Pp.to||""))+'</span></h2>';
  s+='<div class="cards" style="grid-template-columns:1fr 1fr 1fr">'+
     '<div class="card"><h3>Open Opportunities</h3><div class="bignum">'+num(Pp.total||0)+'</div></div>'+
     '<div class="card"><h3>Weighted Value <span class="sub">(amount set)</span></h3><div class="bignum">'+money(Pp.amountTotal||0)+'</div></div>'+
     '<div class="card"><h3>Expected-Close Deals</h3><div class="bignum">'+num((Pp.expected||[]).length)+'</div><div class="barpct">with a $ value &amp; date</div></div>'+
     '</div>';
  s+='<div class="scroll" style="margin-top:14px"><table><tr><th style="text-align:left">Stage</th><th>Open</th><th>Value<br><small>(amount set)</small></th></tr>';
  (Pp.byStage||[]).forEach(function(b){ s+='<tr><td class="stage">'+esc(b.stage)+'</td><td class="auto">'+num(b.count)+'</td><td>'+money(b.amount)+'</td></tr>'; });
  s+='</table></div>';
  if((Pp.expected||[]).length){
    s+='<h2 style="font-size:15px;margin:22px 0 10px">Expected to Close <span class="hint">soonest first · overdue in red</span></h2><div class="scroll"><table>'+
       '<tr><th style="text-align:left">Deal</th><th>Owner</th><th>Stage</th><th>Amount</th><th>Close</th><th>Days</th></tr>';
    Pp.expected.forEach(function(x){ var od=(x.dClose!=null&&x.dClose<0);
      s+='<tr><td class="stage">'+esc(x.name)+'</td><td>'+esc(shortName(x.owner))+'</td><td>'+esc(x.stage)+'</td><td class="auto">'+money(x.amount)+'</td>'+
         '<td>'+esc(fmtDate(x.close))+'</td><td'+(od?' class="od"':'')+'>'+(x.dClose==null?'—':(od?('+'+(-x.dClose)+'d late'):(x.dClose+'d')))+'</td></tr>'; });
    s+='</table></div>';
  }
  return s+'</section>';
}
function shortName(full){ var f=(full||"").trim(); if(SETTER[f])return SETTER[f]; if(REP_COLOR[f])return f; var first=f.split(" ")[0]; return first||f; }


function openEdit(el){
  if(el.querySelector("input,textarea"))return;
  var key=el.getAttribute("data-mkey"), type=el.getAttribute("data-mtype")||"num";
  var cur=mval(key); if(cur===""||cur==null){var dfl=el.getAttribute("data-mdef"); if(dfl!=null&&dfl!=="")cur=dfl;}
  if(type==="text"){ el.innerHTML='<textarea class="min">'+esc(cur)+'</textarea>'; }
  else { var td=el.closest("td"); if(td)td.classList.add("medit"); el.innerHTML='<input class="min" type="number" step="any" value="'+esc(cur)+'">'; }
  var inp=el.querySelector(".min"); inp.focus(); try{inp.select();}catch(e){}
  var done=function(save){ if(inp._d)return; inp._d=1;
    if(save){ var v = type==="text" ? inp.value : (inp.value===""?"":Number(inp.value)); saveManual(key,v); }
    else renderKeep(); };
  inp.addEventListener("keydown",function(ev){
    if(ev.key==="Enter" && type!=="text"){ev.preventDefault();done(true);}
    else if(ev.key==="Escape"){ev.preventDefault();done(false);} });
  inp.addEventListener("blur",function(){done(true);});
}
function renderKeep(){var y=window.scrollY;renderAll();window.scrollTo(0,y);}
function flashSaved(){var t=document.getElementById("savetag");t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove("on");},1200);}
function saveManual(key,value){
  if(MODE==="quarter"||MODE==="day")return;
  var mode=MODE, st=store(); st.values[key]=value; renderKeep();
  var path="/api/manager?period="+(mode==="month"?SEL.month:SEL.week);
  fetch(api(path),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key:key,value:value})})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(j){ if(j&&j.values){ if(mode==="month")MG=j; else M=j; renderKeep(); } flashSaved(); })
    .catch(function(){});
}
document.addEventListener("click",function(e){var el=e.target.closest(".me,.notebody");if(el)openEdit(el);});


function jget(p){return fetch(api(p),{cache:"no-store",credentials:"same-origin"}).then(function(r){
  if(r.status===401){location.href="/manager";return null;}
  return r.json().catch(function(){return null;});}).catch(function(){return null;});}
function loadPeriod(kind,start,force){
  var k=kind+":"+start; if(PD[k]&&!force&&!PD[k].error)return Promise.resolve(PD[k]);
  return jget("/api/period?kind="+kind+"&start="+encodeURIComponent(start)).then(function(j){PD[k]=j||{error:"no response"};return PD[k];});}

function loadMode(force){
  var kind=MODE, sel=SEL[kind], rest=trendStarts(kind).filter(function(s){return s!==sel;}).reverse();
  if(kind==="month"&&rest.indexOf(ymAdd(sel,-1))<0)rest.unshift(ymAdd(sel,-1));
  var extra=[];
  if(kind==="week")extra.push(jget("/api/manager?period="+SEL.week).then(function(j){M=(j&&j.values)?j:{values:{}};}));
  if(kind==="month"){extra.push(jget("/api/manager?period="+SEL.month).then(function(j){MG=(j&&j.values)?j:{values:{}};}));
    if(PIPE===null||force)extra.push(jget("/api/pipeline").then(function(j){if(j)PIPE=j;}));}
  if((kind==="week"||kind==="day")&&(FC===null||force))extra.push(jget("/api/forecast").then(function(j){if(j)FC=j;}));
  var first=loadPeriod(kind,sel,force);
  return Promise.all([first].concat(extra)).then(function(){
    if(MODE===kind&&SEL[kind]===sel)safeRender();
    function next(){var s=rest.shift();if(s==null)return Promise.resolve();
      var isCurP=(s===CUR[kind]);return loadPeriod(kind,s,force&&isCurP).then(next);}
    return Promise.all([next(),next()]);
  }).then(function(){ if(MODE===kind)safeRender(); });
}
function safeRender(){ if(!document.querySelector("#report input,#report textarea")) renderKeep(); }
function showLoading(msg){var st=document.getElementById("status");st.innerHTML=msg;st.hidden=false;document.getElementById("report").hidden=true;}
function updateNav(){
  document.getElementById("mlabel").innerHTML=esc(pLabel(MODE,SEL[MODE]))+'<span class="sofar">'+(SEL[MODE]===CUR[MODE]?"current, so far":"&nbsp;")+'</span>';
  document.getElementById("mnext").disabled=(SEL[MODE]>=CUR[MODE]);
  ["Day","Week","Month","Quarter"].forEach(function(n){document.getElementById("tab"+n).classList.toggle("on",MODE===n.toLowerCase());});
  var dp=document.getElementById("dpick"); dp.hidden=(MODE!=="day"); dp.max=CUR.day; if(MODE==="day")dp.value=SEL.day;
}
function setMode(mode){ if(mode===MODE)return; MODE=mode; renderAll(); loadMode(false); }
function go(delta){ var t=pAdd(MODE,SEL[MODE],delta); if(t>CUR[MODE])return; SEL[MODE]=t; renderAll(); loadMode(false); }
document.getElementById("tabDay").onclick=function(){setMode("day");};
document.getElementById("tabWeek").onclick=function(){setMode("week");};
document.getElementById("dpick").onchange=function(){var v=this.value;if(!/^\d{4}-\d{2}-\d{2}$/.test(v)||v>CUR.day)return;SEL.day=v;renderAll();loadMode(false);};
document.getElementById("tabMonth").onclick=function(){setMode("month");};
document.getElementById("tabQuarter").onclick=function(){setMode("quarter");};
document.getElementById("mprev").onclick=function(){go(-1);};
document.getElementById("mnext").onclick=function(){go(1);};
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-clm]");if(b){CLM=b.getAttribute("data-clm");renderKeep();return;}
  b=e.target.closest("[data-stm]");if(b){STM=b.getAttribute("data-stm");renderKeep();}});

(function(){var h=(location.hash||"").slice(1);if(h==="day"||h==="month"||h==="quarter")MODE=h;})();

renderAll();
loadMode(false);
setInterval(function(){ if(SEL[MODE]===CUR[MODE]) loadMode(true); },180000);
</script>
